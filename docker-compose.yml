services:
  aps:
    build: .
    container_name: advanced-professional-suite
    ports:
      - "8000:8000"
    environment:
      PDFSMITH_MAX_MB: "100"
      MAX_WORKERS: "4"
      RATE_LIMIT_ENABLED: "true"
    restart: unless-stopped
    # Documents are processed in memory; nothing is stored.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
